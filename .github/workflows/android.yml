name: Сборка APK

# Каждый push в main собирает APK и кладёт его в Releases.
# На KZ-сервере Android SDK не влезает (4 ГБ диска, 3 ГБ RAM) — собираем здесь.
# Ядро туннеля libbox (sing-box) собирается из исходников отдельной задачей и кэшируется
# по версии: пересборка только при смене SINGBOX_VERSION или патча.
# Патч core/patch-singbox.py обязателен: без него Reality на наших узлах не проходит
# (sing-box вырезает X25519MLKEM768 из ClientHello, Xray на узлах его требует).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SINGBOX_VERSION: v1.14.1
  GOMOBILE_VERSION: v0.1.13
  CORE_TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api

jobs:
  libbox:
    name: Ядро sing-box (libbox.aar)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Кэш ядра
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            libbox.aar
            sing-box-linux-amd64
          key: core-${{ env.SINGBOX_VERSION }}-gomobile-${{ env.GOMOBILE_VERSION }}-${{ hashFiles('core/patch-singbox.py') }}

      - name: Исходники sing-box
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SINGBOX_VERSION }}
          path: sing-box

      - name: Патч ядра (Reality + MLKEM)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 core/patch-singbox.py sing-box

      - name: Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sing-box/go.sum

      - name: JDK 17
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Собрать libbox и тестовый бинарь для Linux
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        shell: bash
        run: |
          set -o pipefail
          {
            go version; java -version 2>&1 | head -1
            go install -v github.com/sagernet/gomobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
            go install -v github.com/sagernet/gomobile/cmd/gobind@${{ env.GOMOBILE_VERSION }}
            export PATH="$PATH:$(go env GOPATH)/bin"
            ls "$ANDROID_HOME/ndk" || true
            # тот же патченый код в виде обычного бинаря — для проверки Reality с сервера
            CGO_ENABLED=0 go build -v -trimpath -tags "${{ env.CORE_TAGS }}" -o ../sing-box-linux-amd64 ./cmd/sing-box
            go run ./cmd/internal/build_libbox -target android
            ls -la libbox.aar
            cp libbox.aar ../libbox.aar
          } 2>&1 | tee ../core-build.log

      # Лог сборки ядра при падении — в ветку ci-logs (см. ниже, та же причина: логи Actions без входа не читаются)
      - name: Лог ядра при падении
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs && cp core-build.log /tmp/ci-logs/core-${{ github.run_number }}.log
          rm -rf sing-box
          git config user.name "ci" && git config user.email "ci@noctilis.net"
          git checkout --orphan ci-logs
          git rm -rfq . || true
          cp /tmp/ci-logs/*.log .
          git add *.log
          git commit -qm "лог ядра ${{ github.run_number }}"
          git push -f origin ci-logs

      - name: Артефакт ядра
        uses: actions/upload-artifact@v4
        with:
          name: core
          path: |
            libbox.aar
            sing-box-linux-amd64

  build:
    name: APK
    needs: libbox
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Ядро
        uses: actions/download-artifact@v4
        with:
          name: core
          path: core-out

      - name: Разложить ядро
        run: |
          mkdir -p app/libs
          cp core-out/libbox.aar app/libs/libbox.aar
          cp core-out/sing-box-linux-amd64 sing-box-linux-amd64 && chmod +x sing-box-linux-amd64

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже стоит на образе ubuntu-latest (ANDROID_HOME задан, лицензии приняты) —
      # AGP докачает недостающую платформу сам; отдельный шаг установки SDK падал (22.09).
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Собрать APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 0.0.${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Логи Actions без входа в GitHub не читаются (403), а на KZ входа нет — поэтому при
      # падении кладём лог сборки в ветку ci-logs, откуда его можно прочитать как raw-файл.
      - name: Лог сборки при падении
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs && cp build.log /tmp/ci-logs/build-${{ github.run_number }}.log
          git config user.name "ci" && git config user.email "ci@noctilis.net"
          git checkout --orphan ci-logs
          git rm -rfq . || true
          cp /tmp/ci-logs/*.log .
          git add *.log
          git commit -qm "лог сборки ${{ github.run_number }}"
          git push -f origin ci-logs

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk noctilis-android-0.0.${{ github.run_number }}.apk

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: noctilis-android-apk
          path: noctilis-android-*.apk

      - name: Выложить в Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: NOCTILIS 0.0.${{ github.run_number }}
          prerelease: true
          files: |
            noctilis-android-*.apk
            sing-box-linux-amd64
