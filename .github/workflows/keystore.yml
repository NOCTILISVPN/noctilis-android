name: Ключ подписи (один раз)

# Создаёт постоянный ключ подписи APK и кладёт его в репозиторий ЗАШИФРОВАННЫМ.
# Пароль — секрет репозитория KEYSTORE_PASS: его придумывает и вводит Андрей в
# Settings → Secrets and variables → Actions, мне он не сообщается.
# Без постоянного ключа каждая сборка подписывалась случайным ключом раннера, и
# обновление не вставало поверх («конфликтует с другим пакетом», 22.09.2026).
# Запускать вручную (workflow_dispatch) один раз. Повторный запуск ключ НЕ перезапишет.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          test -n "$KEYSTORE_PASS" || { echo "нет секрета KEYSTORE_PASS"; exit 1; }
          test ${#KEYSTORE_PASS} -ge 16 || { echo "пароль короче 16 знаков — придумать длиннее"; exit 1; }
          if [ -f core/noctilis-keystore.p12.enc ]; then echo "ключ уже есть — не перезаписываю"; exit 1; fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Создать и зашифровать ключ
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          keytool -genkeypair -v -keystore noctilis.p12 -storetype PKCS12 -alias noctilis \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=NOCTILIS, O=NOCTILIS VPN, C=KZ"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in noctilis.p12 -out core/noctilis-keystore.p12.enc -pass env:KEYSTORE_PASS
          rm -f noctilis.p12
          keytool -list -keystore core/noctilis-keystore.p12.enc -storepass x >/dev/null 2>&1 && { echo "файл не зашифрован?!"; exit 1; } || true

      - name: Сохранить в репозиторий
        run: |
          git config user.name "ci" && git config user.email "ci@noctilis.net"
          git add core/noctilis-keystore.p12.enc
          git commit -m "Ключ подписи APK (зашифрован паролем KEYSTORE_PASS)"
          git push origin HEAD:main
